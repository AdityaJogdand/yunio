[project]
name = "yunio"
version = "0.1.0"
description = "Yunio: voice lost-and-found for mass gatherings, on Gnani Prisma + Timbre"
authors = [
    { name = "AdityaJogdand", email = "ajogdand112@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "indic-transliteration>=2.3.82",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
